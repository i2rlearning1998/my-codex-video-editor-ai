<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13141a" />
    <script>
      // H2: apply the saved UI theme before first paint (no flash).
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('aive.theme');
          if (saved === 'light') theme = 'light';
          else if (saved === 'system')
            theme = matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* H2: the shell's first colours, before the stylesheet arrives. */
      html,
      body {
        background: #13141a;
        color: #eceef4;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f4f5f8;
        color: #14161d;
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>AI-Native Video Editor · Composition Studio</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
