<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#13141a" />
    <script>
      // H2: apply the saved UI theme before first paint (no flash).
      (function () {
        var theme = 'dark';
        try {
          var saved = localStorage.getItem('aive.theme');
          if (saved === 'light') theme = 'light';
          else if (saved === 'system')
            theme = matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        } catch (error) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      /* H2: the shell's first colours, before the stylesheet arrives. */
      html,
      body {
        background: #13141a;
        color: #eceef4;
      }
      html[data-theme='light'],
      html[data-theme='light'] body {
        background: #f4f5f8;
        color: #14161d;
      }
      /* J8: a shimmer skeleton of the editor until the app replaces it. */
      .boot-skeleton {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: 48px 1fr 240px;
        grid-template-columns: 64px 1fr;
        gap: 8px;
        padding: 8px;
        --shimmer-a: #1c1e26;
        --shimmer-b: #272a35;
      }
      html[data-theme='light'] .boot-skeleton {
        --shimmer-a: #e6e8ee;
        --shimmer-b: #f3f4f8;
      }
      .boot-skeleton > *,
      .boot-skeleton .boot-row {
        border-radius: 8px;
        background: linear-gradient(
          90deg,
          var(--shimmer-a) 25%,
          var(--shimmer-b) 37%,
          var(--shimmer-a) 63%
        );
        background-size: 400% 100%;
        animation: boot-shimmer 1.4s ease infinite;
      }
      .boot-skeleton .boot-bar {
        grid-column: 1 / -1;
      }
      .boot-skeleton .boot-timeline {
        grid-column: 1 / -1;
        display: grid;
        align-content: start;
        gap: 8px;
        padding: 40px 12px 12px 240px;
        background: none;
        animation: none;
      }
      .boot-skeleton .boot-row {
        height: 30px;
      }
      .boot-skeleton .boot-brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 12px 16px;
        color: #eceef4;
        font:
          600 15px system-ui,
          sans-serif;
        animation: none;
      }
      html[data-theme='light'] .boot-skeleton .boot-brand {
        color: #14161d;
      }
      .boot-skeleton .boot-brand-mark {
        display: inline-grid;
        place-items: center;
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: #7c5cff;
        color: #fff;
        font-size: 13px;
      }
      @keyframes boot-shimmer {
        from {
          background-position: 100% 50%;
        }
        to {
          background-position: 0 50%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-skeleton > *,
        .boot-skeleton .boot-row {
          animation: none;
        }
      }
    </style>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>%BRAND_NAME% Video Editor · Composition Studio</title>
  </head>
  <body>
    <div id="app" aria-busy="true">
      <div class="boot-skeleton" aria-hidden="true">
        <div class="boot-bar">
          <span class="boot-brand" data-brand-wordmark
            ><span class="boot-brand-mark">%BRAND_MARK%</span
            >%BRAND_WORDMARK%</span
          >
        </div>
        <div></div>
        <div></div>
        <div class="boot-timeline">
          <div class="boot-row"></div>
          <div class="boot-row"></div>
          <div class="boot-row"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
